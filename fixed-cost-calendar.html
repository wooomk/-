<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고정비 달력 — 나의 돈 흐름</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --surface2: #f9f9fb;
    --border: #e8e8ec;
    --border-light: #f0f0f4;
    --text-primary: #1a1a2e;
    --text-secondary: #6b6b80;
    --text-muted: #b0b0c0;
    --income-bg: #fff5f5;
    --income-text: #d63031;
    --income-accent: #ff7675;
    --saving-bg: #f0fff4;
    --saving-text: #00864e;
    --saving-accent: #55efc4;
    --expense-bg: #f0f4ff;
    --expense-text: #0052cc;
    --expense-accent: #74b9ff;
    --weekend-bg: #fafafa;
    --today-bg: #fff9e6;
    --today-border: #f9ca24;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
    --radius: 16px;
    --radius-sm: 8px;
    --mono: 'DM Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── TOP HEADER ── */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: var(--shadow-sm);
  }
  .top-bar h1 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .top-bar h1 span { color: var(--expense-text); }
  .top-bar-actions { display: flex; gap: 10px; align-items: center; }
  .btn {
    font-family: 'Pretendard', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.15s ease;
    letter-spacing: -0.2px;
  }
  .btn-primary {
    background: var(--text-primary);
    color: #fff;
  }
  .btn-primary:hover { background: #2d2d4a; transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .btn-secondary {
    background: var(--border-light);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--border); }

  /* ── LAYOUT ── */
  .layout {
    display: flex;
    gap: 0;
    max-width: 1400px;
    margin: 0 auto;
    padding: 0;
    min-height: calc(100vh - 60px);
  }

  /* ── CALENDAR PANEL (left) ── */
  .calendar-panel {
    flex: 1;
    min-width: 0;
    padding: 20px 20px 20px 24px;
  }

  .calendar-wrapper {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    border: 1px solid var(--border);
  }

  /* STICKY TABLE HEADER */
  .cal-table-container {
    overflow: auto;
    max-height: calc(100vh - 120px);
    position: relative;
  }
  .cal-table {
    width: 100%;
    border-collapse: collapse;
  }
  .cal-table thead {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--text-primary);
  }
  .cal-table thead th {
    padding: 12px 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    border-right: 1px solid rgba(255,255,255,0.08);
    white-space: nowrap;
  }
  .cal-table thead th:last-child { border-right: none; }
  .col-date { width: 90px; }
  .col-day  { width: 36px; }
  .col-type { width: 52px; }
  .col-name { min-width: 130px; }
  .col-amount { width: 120px; text-align: right !important; }
  .col-memo  { min-width: 100px; }

  /* TABLE ROWS */
  .cal-table tbody tr {
    border-bottom: 1px solid var(--border-light);
    transition: background 0.1s;
  }
  .cal-table tbody tr:last-child { border-bottom: none; }
  .cal-table tbody tr:hover { filter: brightness(0.97); }

  .cal-table tbody td {
    padding: 9px 10px;
    vertical-align: middle;
    font-size: 13px;
  }

  /* Date cell */
  .date-cell { white-space: nowrap; }
  .date-year { font-size: 10px; color: var(--text-muted); font-family: var(--mono); display: block; line-height: 1; }
  .date-main { font-size: 13px; font-weight: 600; font-family: var(--mono); }
  .date-month { color: var(--text-secondary); font-weight: 400; }

  /* Day badge */
  .day-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 600;
  }
  .day-sat .day-badge { background: #e8f0fe; color: #4a6cf7; }
  .day-sun .day-badge { background: #fde8e8; color: #e74c3c; }
  .day-week .day-badge { background: var(--border-light); color: var(--text-secondary); }
  .today-row .day-badge { background: var(--today-border) !important; color: #fff !important; box-shadow: 0 2px 6px rgba(249,202,36,0.4); }

  /* Type badge */
  .type-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 2px 7px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .badge-income  { background: var(--income-bg); color: var(--income-text); }
  .badge-saving  { background: var(--saving-bg); color: var(--saving-text); }
  .badge-expense { background: var(--expense-bg); color: var(--expense-text); }

  /* Row bg */
  .row-income  { background: var(--income-bg); }
  .row-saving  { background: var(--saving-bg); }
  .row-expense { background: var(--expense-bg); }
  .row-weekend { background: var(--weekend-bg); }
  .today-row   { background: var(--today-bg) !important; border-left: 3px solid var(--today-border); }

  /* Empty day row */
  .row-empty {
    background: transparent !important;
  }
  .row-empty td { padding: 7px 10px; }
  .row-empty:hover { filter: none !important; }

  /* Month separator */
  .month-sep td {
    padding: 16px 10px 8px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    background: var(--bg) !important;
    border-bottom: 2px solid var(--border);
    letter-spacing: -0.3px;
  }

  /* Amount cell */
  .amount-cell {
    text-align: right;
    font-family: var(--mono);
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.15s;
    padding: 4px 6px !important;
    position: relative;
  }
  .amount-cell:hover { background: rgba(0,0,0,0.04); }
  .amount-predicted { color: var(--text-muted); font-style: italic; }
  .amount-confirmed { color: var(--text-primary); font-weight: 600; }
  .amount-income    { color: var(--income-text); }
  .amount-saving    { color: var(--saving-text); }
  .amount-expense   { color: var(--expense-text); }

  .amount-input {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    text-align: right;
    width: 110px;
    border: 2px solid var(--text-primary);
    border-radius: 6px;
    padding: 3px 8px;
    outline: none;
    background: #fff;
    color: var(--text-primary);
  }

  /* item name */
  .item-name { font-weight: 500; color: var(--text-primary); }
  .item-name-empty { color: var(--text-muted); font-size: 12px; }

  /* memo input */
  .memo-cell { font-size: 12px; color: var(--text-muted); cursor: pointer; }
  .memo-input {
    font-family: 'Pretendard', sans-serif;
    font-size: 12px;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    outline: none;
    background: #fff;
  }

  /* Load more */
  .load-more-row td {
    padding: 20px;
    text-align: center;
    background: transparent;
  }
  .load-more-btn {
    font-family: 'Pretendard', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 28px;
    border-radius: 24px;
    border: 1.5px solid var(--border);
    background: #fff;
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.15s;
  }
  .load-more-btn:hover { border-color: var(--text-primary); color: var(--text-primary); transform: translateY(-1px); }

  /* ── MASTER PANEL (right) ── */
  .master-panel {
    width: 400px;
    flex-shrink: 0;
    padding: 20px 24px 20px 0;
    position: sticky;
    top: 60px;
    height: calc(100vh - 60px);
    overflow-y: auto;
  }

  .master-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .master-header {
    padding: 16px 18px;
    background: var(--text-primary);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .master-header h2 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .master-header p { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 2px; }
  .btn-add {
    font-family: 'Pretendard', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    background: rgba(255,255,255,0.15);
    color: #fff;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .btn-add:hover { background: rgba(255,255,255,0.25); }

  /* Master table */
  .master-scroll { overflow-x: auto; }
  .master-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .master-table thead th {
    padding: 8px 8px;
    background: var(--bg);
    color: var(--text-muted);
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    text-align: left;
  }
  .master-table tbody tr {
    border-bottom: 1px solid var(--border-light);
    transition: background 0.1s;
  }
  .master-table tbody tr:hover { background: var(--surface2); }
  .master-table tbody td {
    padding: 7px 8px;
    vertical-align: middle;
    color: var(--text-primary);
  }
  .master-input {
    font-family: 'Pretendard', sans-serif;
    font-size: 12px;
    width: 100%;
    border: 1.5px solid transparent;
    border-radius: 6px;
    padding: 4px 6px;
    background: transparent;
    color: var(--text-primary);
    transition: border-color 0.15s, background 0.15s;
    outline: none;
  }
  .master-input:focus {
    border-color: var(--text-primary);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(26,26,46,0.06);
  }
  .master-select {
    font-family: 'Pretendard', sans-serif;
    font-size: 12px;
    width: 100%;
    border: 1.5px solid transparent;
    border-radius: 6px;
    padding: 4px 4px;
    background: transparent;
    color: var(--text-primary);
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }
  .master-select:focus { border-color: var(--text-primary); background: #fff; }
  .master-amount-input {
    font-family: var(--mono);
    font-size: 12px;
    text-align: right;
  }
  .btn-del {
    font-family: 'Pretendard', sans-serif;
    font-size: 10px;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid #ffd0d0;
    background: #fff5f5;
    color: var(--income-text);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .btn-del:hover { background: var(--income-text); color: #fff; border-color: var(--income-text); }

  /* Summary card */
  .summary-card {
    margin-top: 12px;
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
    padding: 16px 18px;
  }
  .summary-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border-light);
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-label { font-size: 13px; font-weight: 500; color: var(--text-secondary); }
  .summary-value { font-family: var(--mono); font-size: 14px; font-weight: 600; }
  .val-income  { color: var(--income-text); }
  .val-saving  { color: var(--saving-text); }
  .val-expense { color: var(--expense-text); }
  .val-net     { color: var(--text-primary); }

  /* Legend */
  .legend {
    display: flex;
    gap: 10px;
    padding: 10px 18px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: var(--text-primary);
    color: #fff;
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow-lg);
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    pointer-events: none;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* Mobile responsive */
  @media (max-width: 900px) {
    .master-panel { display: none; }
    .calendar-panel { padding: 12px; }
  }
  @media (max-width: 600px) {
    .col-memo { display: none; }
    .top-bar h1 { font-size: 15px; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="top-bar">
  <h1>💸 고정비 <span>달력</span></h1>
  <div class="top-bar-actions">
    <button class="btn btn-secondary" onclick="toggleMasterPanel()">⚙ 규칙 관리</button>
    <button class="btn btn-primary" onclick="scrollToToday()">오늘</button>
  </div>
</header>

<!-- LAYOUT -->
<div class="layout">

  <!-- LEFT: CALENDAR -->
  <div class="calendar-panel" id="calendarPanel">
    <div class="calendar-wrapper">
      <div class="cal-table-container" id="calContainer">
        <table class="cal-table" id="calTable">
          <thead>
            <tr>
              <th class="col-date" style="text-align:left;">날짜</th>
              <th class="col-day" style="text-align:center;">요일</th>
              <th class="col-type" style="text-align:center;">구분</th>
              <th class="col-name" style="text-align:left;">내용</th>
              <th class="col-amount" style="text-align:right;">금액 (원)</th>
              <th class="col-memo" style="text-align:left;">메모</th>
            </tr>
          </thead>
          <tbody id="calBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- RIGHT: MASTER PANEL -->
  <div class="master-panel" id="masterPanel">
    <div class="master-card">
      <div class="master-header">
        <div>
          <h2>📋 고정비 마스터 규칙</h2>
          <p>항목을 추가하면 달력에 자동 반영됩니다</p>
        </div>
        <button class="btn-add" onclick="addMasterRow()">+ 추가</button>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--income-text)"></div>수입</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--saving-text)"></div>저축</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--expense-text)"></div>지출</div>
      </div>
      <div class="master-scroll">
        <table class="master-table">
          <thead>
            <tr>
              <th>기준</th>
              <th>구분</th>
              <th>내용</th>
              <th>기본금액</th>
              <th>시작월</th>
              <th>종료월</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="masterBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Monthly Summary -->
    <div class="summary-card" id="summaryCard">
      <div class="summary-title">📊 이번 달 요약</div>
      <div class="summary-row">
        <span class="summary-label">💰 수입</span>
        <span class="summary-value val-income" id="sumIncome">0원</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">🏦 저축</span>
        <span class="summary-value val-saving" id="sumSaving">0원</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">💳 지출</span>
        <span class="summary-value val-expense" id="sumExpense">0원</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">📈 실수령 (수입−저축−지출)</span>
        <span class="summary-value val-net" id="sumNet">0원</span>
      </div>
    </div>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════
   STATE & STORAGE
═══════════════════════════════════════════ */
const STORAGE_RULES   = 'fixedcal_rules_v2';
const STORAGE_OVERRIDES = 'fixedcal_overrides_v2';
const STORAGE_MEMOS   = 'fixedcal_memos_v2';

const DAYS_KO = ['일','월','화','수','목','금','토'];
const TYPE_MAP = { income:'수입', saving:'저축', expense:'지출' };
const TYPE_KEY = { '수입':'income','저축':'saving','지출':'expense' };

let masterRules = [];
let cellOverrides = {}; // key: "YYYY-MM-DD-ruleId" → {amount, confirmed}
let cellMemos    = {}; // key: "YYYY-MM-DD-ruleId" → string

function loadStorage() {
  try { masterRules   = JSON.parse(localStorage.getItem(STORAGE_RULES))   || defaultRules(); } catch { masterRules = defaultRules(); }
  try { cellOverrides = JSON.parse(localStorage.getItem(STORAGE_OVERRIDES)) || {}; } catch { cellOverrides = {}; }
  try { cellMemos     = JSON.parse(localStorage.getItem(STORAGE_MEMOS))     || {}; } catch { cellMemos = {}; }
}
function saveRules()     { localStorage.setItem(STORAGE_RULES,    JSON.stringify(masterRules)); }
function saveOverrides() { localStorage.setItem(STORAGE_OVERRIDES, JSON.stringify(cellOverrides)); }
function saveMemos()     { localStorage.setItem(STORAGE_MEMOS,     JSON.stringify(cellMemos)); }

function defaultRules() {
  return [
    { id: uid(), basis:'25',   type:'income',  name:'월급',         amount:3200000, startMonth:1, endMonth:12 },
    { id: uid(), basis:'23',   type:'saving',  name:'청년도약계좌', amount:700000,  startMonth:1, endMonth:12 },
    { id: uid(), basis:'1',    type:'expense', name:'월세',         amount:550000,  startMonth:1, endMonth:12 },
    { id: uid(), basis:'25',   type:'expense', name:'통신비',       amount:55000,   startMonth:1, endMonth:12 },
    { id: uid(), basis:'말일', type:'expense', name:'관리비',       amount:80000,   startMonth:1, endMonth:12 },
    { id: uid(), basis:'15',   type:'expense', name:'넷플릭스',     amount:17000,   startMonth:1, endMonth:12 },
    { id: uid(), basis:'5',    type:'expense', name:'교통카드',     amount:60000,   startMonth:1, endMonth:12 },
    { id: uid(), basis:'10',   type:'expense', name:'스포티파이',   amount:11000,   startMonth:1, endMonth:6  },
  ];
}
function uid() { return Math.random().toString(36).slice(2,10); }

/* ═══════════════════════════════════════════
   DATE UTILS
═══════════════════════════════════════════ */
function isLeapYear(y) { return (y%4===0&&y%100!==0)||y%400===0; }
function daysInMonth(y,m) { return new Date(y,m,0).getDate(); }
function isLastDay(y,m,d) { return d === daysInMonth(y,m); }
function todayStr() {
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}
function dateStr(y,m,d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function getDayOfWeek(y,m,d) {
  return new Date(y,m-1,d).getDay(); // 0=Sun
}

/* ═══════════════════════════════════════════
   RULE MATCHING
═══════════════════════════════════════════ */
const DAYNAME_MAP = {'월':1,'화':2,'수':3,'목':4,'금':5,'토':6,'일':0};

function matchesRule(rule, y, m, d) {
  const sm = Number(rule.startMonth)||1;
  const em = Number(rule.endMonth)||12;
  if (m < sm || m > em) return false;
  const basis = String(rule.basis).trim();
  if (basis === '말일') return isLastDay(y,m,d);
  if (DAYNAME_MAP[basis] !== undefined) {
    return getDayOfWeek(y,m,d) === DAYNAME_MAP[basis];
  }
  const num = Number(basis);
  if (!isNaN(num) && num >= 1 && num <= 31) {
    // handle months shorter than basis
    const maxD = daysInMonth(y,m);
    if (num > maxD) return d === maxD; // snap to last day
    return d === num;
  }
  return false;
}

function getRulesForDate(y,m,d) {
  return masterRules.filter(r => matchesRule(r,y,m,d));
}

/* ═══════════════════════════════════════════
   CALENDAR RENDERING
═══════════════════════════════════════════ */
const START = new Date(2026,0,1); // Jan 1 2026
let daysRendered = 0;
const CHUNK = 90; // render 90 days at a time
const today = todayStr();
let todayRowEl = null;

function renderCalendar(reset=false) {
  const tbody = document.getElementById('calBody');
  if (reset) { tbody.innerHTML=''; daysRendered=0; todayRowEl=null; }

  const frag = document.createDocumentFragment();
  let lastMonth = -1;
  if (daysRendered > 0) {
    // get last rendered month
    const rows = tbody.querySelectorAll('tr[data-year]');
    if (rows.length) {
      const last = rows[rows.length-1];
      lastMonth = Number(last.dataset.month);
    }
  }

  for (let i = daysRendered; i < daysRendered + CHUNK; i++) {
    const cur = new Date(START);
    cur.setDate(START.getDate() + i);
    const y = cur.getFullYear();
    const m = cur.getMonth()+1;
    const d = cur.getDate();
    const dow = cur.getDay(); // 0=Sun
    const ds = dateStr(y,m,d);
    const isToday = ds === today;
    const isSat = dow===6, isSun = dow===0;

    // Month separator
    if (m !== lastMonth) {
      const sepTr = document.createElement('tr');
      sepTr.className = 'month-sep';
      sepTr.innerHTML = `<td colspan="6">${y}년 ${m}월</td>`;
      frag.appendChild(sepTr);
      lastMonth = m;
    }

    const rules = getRulesForDate(y,m,d);

    if (rules.length === 0) {
      // empty day row
      const tr = document.createElement('tr');
      tr.dataset.year=y; tr.dataset.month=m; tr.dataset.day=d;
      const dayClass = isSat?'day-sat':isSun?'day-sun':'day-week';
      let rowCls = 'row-empty';
      if (isSat||isSun) rowCls += ' row-weekend';
      if (isToday) rowCls += ' today-row';
      tr.className = rowCls;
      tr.innerHTML = `
        <td class="date-cell">
          <span class="date-year">${y}</span>
          <span class="date-main"><span class="date-month">${String(m).padStart(2,'0')}.</span>${String(d).padStart(2,'0')}</span>
        </td>
        <td style="text-align:center;"><span class="day-badge ${dayClass}">${DAYS_KO[dow]}</span></td>
        <td></td><td class="item-name-empty" style="color:var(--text-muted);font-size:11px;">—</td>
        <td></td><td></td>`;
      if (isToday) todayRowEl = tr;
      frag.appendChild(tr);
    } else {
      rules.forEach((rule, ri) => {
        const tr = document.createElement('tr');
        tr.dataset.year=y; tr.dataset.month=m; tr.dataset.day=d;
        const dayClass = isSat?'day-sat':isSun?'day-sun':'day-week';
        const tk = rule.type; // income|saving|expense
        let rowCls = `row-${tk}`;
        if (isSat||isSun) rowCls += ' row-weekend';
        if (isToday) rowCls += ' today-row';
        tr.className = rowCls;

        const overKey = `${ds}-${rule.id}`;
        const ov = cellOverrides[overKey];
        const memo = cellMemos[overKey] || '';
        const baseAmount = rule.amount;
        const displayAmount = ov ? ov.amount : baseAmount;
        const confirmed = ov ? ov.confirmed : false;

        // amount display
        let amtClass = confirmed ? `amount-confirmed amount-${tk}` : `amount-predicted amount-${tk}`;

        // first rule: show date cell; subsequent rules: empty date cell
        const dateCell = ri===0 ? `
          <td class="date-cell" rowspan="${rules.length}">
            <span class="date-year">${y}</span>
            <span class="date-main"><span class="date-month">${String(m).padStart(2,'0')}.</span>${String(d).padStart(2,'0')}</span>
          </td>
          <td style="text-align:center;" rowspan="${rules.length}"><span class="day-badge ${dayClass}">${DAYS_KO[dow]}</span></td>
        ` : '';
        // But rowspan doesn't work easily in doc frag; let's handle simply (one row per rule)
        // Actually let's do simple approach: each rule gets its own full row, but only first shows date+day
        tr.innerHTML = `
          <td class="date-cell">
            ${ri===0 ? `<span class="date-year">${y}</span><span class="date-main"><span class="date-month">${String(m).padStart(2,'0')}.</span>${String(d).padStart(2,'0')}</span>` : ''}
          </td>
          <td style="text-align:center;">${ri===0 ? `<span class="day-badge ${dayClass}">${DAYS_KO[dow]}</span>` : ''}</td>
          <td style="text-align:center;"><span class="type-badge badge-${tk}">${TYPE_MAP[tk]}</span></td>
          <td class="item-name">${escHtml(rule.name)}</td>
          <td class="amount-cell col-amount ${amtClass}" 
              data-key="${overKey}" data-base="${baseAmount}" data-type="${tk}"
              onclick="startEdit(this)">
            ${fmt(displayAmount)}
          </td>
          <td class="col-memo memo-cell" data-key="${overKey}" onclick="startMemoEdit(this)">${memo ? escHtml(memo) : '<span style="color:var(--text-muted)">메모</span>'}</td>
        `;
        if (isToday && ri===0) todayRowEl = tr;
        frag.appendChild(tr);
      });
    }
  }

  // Load more button
  const oldBtn = tbody.querySelector('.load-more-row');
  if (oldBtn) oldBtn.remove();
  const btnTr = document.createElement('tr');
  btnTr.className = 'load-more-row';
  btnTr.innerHTML = `<td colspan="6"><button class="load-more-btn" onclick="loadMore()">↓ 90일 더 보기</button></td>`;
  frag.appendChild(btnTr);

  tbody.appendChild(frag);
  daysRendered += CHUNK;

  updateSummary();
}

function loadMore() {
  const tbody = document.getElementById('calBody');
  const btnTr = tbody.querySelector('.load-more-row');
  if (btnTr) btnTr.remove();
  renderCalendar(false);
}

function scrollToToday() {
  if (todayRowEl) {
    todayRowEl.scrollIntoView({behavior:'smooth', block:'center'});
  } else {
    // today might not be rendered yet — scroll to top
    document.getElementById('calContainer').scrollTop = 0;
    showToast('오늘 날짜가 이미 화면에 있어요 📅');
  }
}

/* ═══════════════════════════════════════════
   INLINE EDIT — AMOUNT
═══════════════════════════════════════════ */
function startEdit(cell) {
  if (cell.querySelector('input')) return;
  const key = cell.dataset.key;
  const tk  = cell.dataset.type;
  const ov  = cellOverrides[key];
  const currentVal = ov ? ov.amount : Number(cell.dataset.base);

  cell.innerHTML = '';
  const inp = document.createElement('input');
  inp.type='number';
  inp.className='amount-input';
  inp.value = currentVal;
  cell.appendChild(inp);
  inp.focus();
  inp.select();

  function commit() {
    const v = Number(inp.value);
    if (!isNaN(v) && inp.value !== '') {
      cellOverrides[key] = { amount: v, confirmed: true };
      saveOverrides();
      cell.textContent = fmt(v);
      cell.className = `amount-cell col-amount amount-confirmed amount-${tk}`;
      showToast('✅ 실제 금액이 저장되었어요');
      updateSummary();
    } else {
      // revert
      const base = Number(cell.dataset.base);
      const ov2 = cellOverrides[key];
      const disp = ov2 ? ov2.amount : base;
      const conf = ov2 ? ov2.confirmed : false;
      cell.textContent = fmt(disp);
      cell.className = `amount-cell col-amount ${conf?'amount-confirmed':'amount-predicted'} amount-${tk}`;
    }
  }

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { inp.blur(); }
    if (e.key === 'Escape') {
      const base = Number(cell.dataset.base);
      const ov2 = cellOverrides[key];
      const disp = ov2 ? ov2.amount : base;
      const conf = ov2 ? ov2.confirmed : false;
      cell.textContent = fmt(disp);
      cell.className = `amount-cell col-amount ${conf?'amount-confirmed':'amount-predicted'} amount-${tk}`;
    }
  });
  inp.addEventListener('blur', commit);
}

/* ═══════════════════════════════════════════
   INLINE EDIT — MEMO
═══════════════════════════════════════════ */
function startMemoEdit(cell) {
  if (cell.querySelector('input')) return;
  const key = cell.dataset.key;
  const cur = cellMemos[key] || '';
  cell.innerHTML='';
  const inp = document.createElement('input');
  inp.type='text';
  inp.className='memo-input';
  inp.value = cur;
  inp.placeholder='메모 입력...';
  cell.appendChild(inp);
  inp.focus();
  inp.select();

  function commit() {
    const v = inp.value.trim();
    cellMemos[key] = v;
    saveMemos();
    cell.innerHTML = v ? escHtml(v) : '<span style="color:var(--text-muted)">메모</span>';
  }
  inp.addEventListener('keydown', e => { if(e.key==='Enter'||e.key==='Escape') inp.blur(); });
  inp.addEventListener('blur', commit);
}

/* ═══════════════════════════════════════════
   MASTER PANEL
═══════════════════════════════════════════ */
function renderMaster() {
  const tbody = document.getElementById('masterBody');
  tbody.innerHTML = '';
  masterRules.forEach(rule => {
    const tr = document.createElement('tr');
    tr.dataset.id = rule.id;
    tr.innerHTML = `
      <td><input class="master-input" placeholder="1~31/말일/요일" value="${escHtml(rule.basis)}" onchange="updateRule('${rule.id}','basis',this.value)" style="width:70px;"></td>
      <td>
        <select class="master-select" onchange="updateRule('${rule.id}','type',this.value)" style="width:62px;">
          <option value="income"  ${rule.type==='income' ?'selected':''}>수입</option>
          <option value="saving"  ${rule.type==='saving' ?'selected':''}>저축</option>
          <option value="expense" ${rule.type==='expense'?'selected':''}>지출</option>
        </select>
      </td>
      <td><input class="master-input" placeholder="항목명" value="${escHtml(rule.name)}" onchange="updateRule('${rule.id}','name',this.value)" style="width:80px;"></td>
      <td><input class="master-input master-amount-input" type="number" placeholder="금액" value="${rule.amount}" onchange="updateRule('${rule.id}','amount',this.value)" style="width:72px;"></td>
      <td><input class="master-input" type="number" min="1" max="12" placeholder="1" value="${rule.startMonth||1}" onchange="updateRule('${rule.id}','startMonth',this.value)" style="width:36px;"></td>
      <td><input class="master-input" type="number" min="1" max="12" placeholder="12" value="${rule.endMonth||12}" onchange="updateRule('${rule.id}','endMonth',this.value)" style="width:36px;"></td>
      <td><button class="btn-del" onclick="deleteRule('${rule.id}')">삭제</button></td>
    `;
    tbody.appendChild(tr);
  });
}

function addMasterRow() {
  masterRules.push({ id:uid(), basis:'1', type:'expense', name:'', amount:0, startMonth:1, endMonth:12 });
  saveRules();
  renderMaster();
  refreshCalendar();
  showToast('➕ 새 항목이 추가되었어요');
}

function updateRule(id, field, value) {
  const rule = masterRules.find(r=>r.id===id);
  if (!rule) return;
  if (field==='amount'||field==='startMonth'||field==='endMonth') value = Number(value);
  rule[field] = value;
  saveRules();
  refreshCalendar();
}

function deleteRule(id) {
  masterRules = masterRules.filter(r=>r.id!==id);
  saveRules();
  renderMaster();
  refreshCalendar();
  showToast('🗑 항목이 삭제되었어요');
}

function refreshCalendar() {
  renderCalendar(true);
  updateSummary();
}

/* ═══════════════════════════════════════════
   MONTHLY SUMMARY
═══════════════════════════════════════════ */
function updateSummary() {
  const t = new Date();
  const y = t.getFullYear(), m = t.getMonth()+1;
  let income=0, saving=0, expense=0;
  const dim = daysInMonth(y,m);
  for (let d=1; d<=dim; d++) {
    const rules = getRulesForDate(y,m,d);
    const ds = dateStr(y,m,d);
    rules.forEach(rule => {
      const key = `${ds}-${rule.id}`;
      const ov = cellOverrides[key];
      const amt = ov ? ov.amount : rule.amount;
      if (rule.type==='income') income += amt;
      else if (rule.type==='saving') saving += amt;
      else expense += amt;
    });
  }
  document.getElementById('sumIncome').textContent  = fmt(income)+'원';
  document.getElementById('sumSaving').textContent  = fmt(saving)+'원';
  document.getElementById('sumExpense').textContent = fmt(expense)+'원';
  document.getElementById('sumNet').textContent     = fmt(income-saving-expense)+'원';
}

/* ═══════════════════════════════════════════
   TOGGLE MASTER PANEL (mobile)
═══════════════════════════════════════════ */
function toggleMasterPanel() {
  const p = document.getElementById('masterPanel');
  if (window.innerWidth <= 900) {
    // show as overlay
    p.style.display = p.style.display==='block' ? 'none' : 'block';
    if (p.style.display==='block') {
      p.style.position='fixed';
      p.style.right='0'; p.style.top='60px';
      p.style.width='360px';
      p.style.height='calc(100vh - 60px)';
      p.style.background='var(--bg)';
      p.style.zIndex='200';
      p.style.padding='16px';
      p.style.boxShadow='var(--shadow-lg)';
    }
  }
}

/* ═══════════════════════════════════════════
   UTILS
═══════════════════════════════════════════ */
function fmt(n) {
  return Math.round(n).toLocaleString('ko-KR');
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

/* ═══════════════════════════════════════════
   INIT
═══════════════════════════════════════════ */
function init() {
  loadStorage();
  renderMaster();
  renderCalendar(true);
  // Auto scroll to today-ish area
  setTimeout(() => {
    if (todayRowEl) {
      todayRowEl.scrollIntoView({behavior:'auto', block:'center'});
    }
  }, 100);
}

document.addEventListener('DOMContentLoaded', init);
</script>
